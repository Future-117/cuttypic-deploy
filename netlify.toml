[build]
  command = ""
  publish = "."

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "upgrade-insecure-requests"

[[redirects]]
  from = "/proxy-hf/*"
  to = "https://huggingface.co/:splat"
  status = 200
  force = true
